<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%">
  <defs>
    <marker id="arrow-push" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-pull" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="680" height="180" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Local Repository Card -->
  <rect x="40" y="35" width="200" height="110" rx="10" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="140" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="middle">Local Repository</text>
  <text x="140" y="100" font-family="-apple-system, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Ваш комп'ютер</text>
  <text x="140" y="120" font-family="'Lilex', monospace" font-size="11" fill="#58a6ff" text-anchor="middle">(PyCharm)</text>

  <!-- Push Arrow (Top) -->
  <path d="M 245 65 L 430 65" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-push)"/>
  <rect x="305" y="47" width="65" height="22" rx="5" fill="#0d1117" stroke="#38bdf8" stroke-width="1"/>
  <text x="337" y="62" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Push ↗</text>

  <!-- Pull Arrow (Bottom) -->
  <path d="M 435 115 L 250 115" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-pull)"/>
  <rect x="305" y="104" width="65" height="22" rx="5" fill="#0d1117" stroke="#34d399" stroke-width="1"/>
  <text x="337" y="119" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">↙ Pull</text>

  <!-- Remote Repository Card -->
  <rect x="440" y="35" width="200" height="110" rx="10" fill="#161b22" stroke="#ff6500" stroke-width="1.5"/>
  <text x="540" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="middle">Remote Repository</text>
  <text x="540" y="100" font-family="-apple-system, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Сервер GitHub</text>
  <text x="540" y="120" font-family="'Lilex', monospace" font-size="11" fill="#ffa657" text-anchor="middle">(Ваш Fork)</text>
</svg>
