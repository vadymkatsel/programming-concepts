<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="780" height="220" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Branch Badge: main -->
  <rect x="30" y="20" width="65" height="24" rx="5" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="62" y="36" font-family="'Lilex', monospace" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="middle">main</text>

  <!-- Branch Badge: feature-greeting -->
  <rect x="155" y="166" width="135" height="24" rx="5" fill="#ea580c" fill-opacity="0.15" stroke="#ff6500" stroke-width="1.2"/>
  <text x="222" y="182" font-family="'Lilex', monospace" font-size="11" font-weight="700" fill="#ff6500" text-anchor="middle">feature-greeting</text>

  <!-- Main Branch Line (Upper Track) -->
  <line x1="110" y1="65" x2="680" y2="65" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Feature Branch Line (Lower Track with Branch & Merge Curves) -->
  <!-- Diverge curve: (110,65) -> (185,135) -->
  <!-- Horizontal: (185,135) -> (570,135) -->
  <!-- Merge curve: (570,135) -> (645,65) -->
  <path d="M 110 65 C 145 65, 150 135, 185 135 L 570 135 C 605 135, 610 65, 645 65" fill="none" stroke="#ff6500" stroke-width="3" stroke-linecap="round"/>

  <!-- Commit 1 (main): Initial Commit -->
  <circle cx="110" cy="65" r="7.5" fill="#0d1117" stroke="#38bdf8" stroke-width="3"/>
  <text x="110" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8" text-anchor="middle">Initial Commit</text>

  <!-- Commit 2 (feature): Add greeting file -->
  <circle cx="300" cy="135" r="7.5" fill="#0d1117" stroke="#ff6500" stroke-width="3"/>
  <text x="300" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Add greeting file</text>

  <!-- Commit 3 (main): Update greeting.py -->
  <circle cx="430" cy="65" r="7.5" fill="#0d1117" stroke="#38bdf8" stroke-width="3"/>
  <text x="430" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#7dd3fc" text-anchor="middle">Update greeting.py</text>

  <!-- Commit 4 (feature): Add math logic -->
  <circle cx="490" cy="135" r="7.5" fill="#0d1117" stroke="#ff6500" stroke-width="3"/>
  <text x="490" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">Add math logic</text>

  <!-- Commit 5 (Merge commit on main): Merge PR -->
  <circle cx="645" cy="65" r="8.5" fill="#a855f7" stroke="#c084fc" stroke-width="3"/>
  <text x="645" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#c084fc" text-anchor="middle">Merge commit</text>
  <text x="645" y="93" font-family="'Lilex', monospace" font-size="10" fill="#a855f7" text-anchor="middle">(Resolved)</text>
