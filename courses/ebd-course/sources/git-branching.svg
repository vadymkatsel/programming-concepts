<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="100%" height="100%">
  <defs>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Box -->
  <rect width="680" height="200" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Main Branch Line -->
  <path d="M 60 70 L 620 70" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Branch Curve -->
  <path d="M 180 70 C 220 70, 220 140, 260 140 L 520 140" stroke="#ff6500" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Branch Label -->
  <rect x="40" y="32" width="70" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
  <text x="75" y="48" font-family="'Lilex', monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">main</text>

  <!-- Feature Branch Label -->
  <rect x="180" y="155" width="140" height="24" rx="6" fill="#ea580c" fill-opacity="0.2" stroke="#ff6500" stroke-width="1"/>
  <text x="250" y="171" font-family="'Lilex', monospace" font-size="12" font-weight="700" fill="#ff6500" text-anchor="middle">feature-greeting</text>

  <!-- Commit 1: Initial Commit -->
  <circle cx="180" cy="70" r="9" fill="#0d1117" stroke="#38bdf8" stroke-width="4"/>
  <text x="180" y="102" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Initial Commit</text>

  <!-- Commit 2: Add greeting file -->
  <circle cx="330" cy="140" r="9" fill="#0d1117" stroke="#ff6500" stroke-width="4"/>
  <text x="330" y="120" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1" font-weight="600" text-anchor="middle">Add greeting file</text>

  <!-- Commit 3: Add math logic -->
  <circle cx="470" cy="140" r="9" fill="#0d1117" stroke="#ff6500" stroke-width="4"/>
  <text x="470" y="120" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1" font-weight="600" text-anchor="middle">Add math logic</text>

  <!-- Commit on main -->
  <circle cx="580" cy="70" r="9" fill="#0d1117" stroke="#38bdf8" stroke-width="4"/>
  <text x="580" y="102" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">main head</text>
</svg>
