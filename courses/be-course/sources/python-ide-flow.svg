<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <!-- Background Card Gradients matching git-flow.svg -->
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ff6500"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="180" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- ==================== Card 1: Code File ==================== -->
  <g filter="url(#shadow)">
    <rect x="25" y="35" width="165" height="110" rx="12" fill="url(#grad-card)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="55" cy="65" r="13" fill="#0284c7" fill-opacity="0.2"/>
    <path d="M 51 60 L 46 65 L 51 70 M 59 60 L 64 65 L 59 70" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Ваш код</text>
    <text x="45" y="105" font-family="'Lilex', 'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">script.py</text>
    <text x="45" y="125" font-family="'Lilex', 'JetBrains Mono', monospace" font-size="11" fill="#64748b">текстові команди</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 195 90 L 245 90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow-blue)"/>
  <rect x="200" y="65" width="40" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="220" y="79" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">Run</text>

  <!-- ==================== Card 2: PyCharm IDE ==================== -->
  <g filter="url(#shadow)">
    <rect x="250" y="35" width="165" height="110" rx="12" fill="url(#grad-card)" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="280" cy="65" r="13" fill="#4f46e5" fill-opacity="0.2"/>
    <rect x="273" y="58" width="14" height="14" rx="2" fill="none" stroke="#818cf8" stroke-width="1.6"/>
    <line x1="273" y1="63" x2="287" y2="63" stroke="#818cf8" stroke-width="1.2"/>
    <text x="303" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">PyCharm</text>
    <text x="270" y="105" font-family="'Lilex', 'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">IDE простір</text>
    <text x="270" y="125" font-family="'Lilex', 'JetBrains Mono', monospace" font-size="11" fill="#64748b">редактор і запуск</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 420 90 L 470 90" fill="none" stroke="#ff6500" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow-orange)"/>
  <rect x="425" y="65" width="40" height="20" rx="5" fill="#0f172a" stroke="#ff6500" stroke-width="1"/>
  <text x="445" y="79" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#ff6500" text-anchor="middle">Exec</text>

  <!-- ==================== Card 3: Interpreter ==================== -->
  <g filter="url(#shadow)">
    <rect x="475" y="35" width="175" height="110" rx="12" fill="url(#grad-card)" stroke="#ff6500" stroke-width="1.5"/>
    <circle cx="505" cy="65" r="13" fill="#ea580c" fill-opacity="0.2"/>
    <!-- Monochromatic Python Logo Icon -->
    <g transform="translate(497, 57)" fill="#ff6500">
      <path d="M 7.8 0.5 C 4.2 0.5 2.2 2 2.2 3.8 L 2.2 5.5 L 7.8 5.5 L 7.8 6.5 L 1.5 6.5 C 0.5 6.5 0 7.5 0 9.2 C 0 11 0.7 12 1.8 12 L 3.2 12 L 3.2 10.2 C 3.2 8.5 4.8 8.5 6.8 8.5 L 10.8 8.5 C 11.8 8.5 12.5 7.8 12.5 6.8 L 12.5 3.2 C 12.5 1.5 11.2 0.5 7.8 0.5 Z"/>
      <circle cx="4.8" cy="3" r="0.9" fill="#0f172a"/>
      <path d="M 8.2 15.5 C 11.8 15.5 13.8 14 13.8 12.2 L 13.8 10.5 L 8.2 10.5 L 8.2 9.5 L 14.5 9.5 C 15.5 9.5 16 8.5 16 6.8 C 16 5 15.3 4 14.2 4 L 12.8 4 L 12.8 5.8 C 12.8 7.5 11.2 7.5 9.2 7.5 L 5.2 7.5 C 4.2 7.5 3.5 8.2 3.5 9.2 L 3.5 12.8 C 3.5 14.5 4.8 15.5 8.2 15.5 Z"/>
      <circle cx="11.2" cy="13" r="0.9" fill="#0f172a"/>
    </g>
    <text x="528" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Python</text>
    <text x="495" y="105" font-family="'Lilex', 'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Інтерпретатор</text>
    <text x="495" y="125" font-family="'Lilex', 'JetBrains Mono', monospace" font-size="11" fill="#64748b">двигун обчислень</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 655 90 L 705 90" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow-green)"/>
  <rect x="660" y="65" width="40" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="680" y="79" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">Print</text>

  <!-- ==================== Card 4: Console ==================== -->
  <g filter="url(#shadow)">
    <rect x="710" y="35" width="145" height="110" rx="12" fill="url(#grad-card)" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="738" cy="65" r="13" fill="#059669" fill-opacity="0.2"/>
    <path d="M 733 61 L 738 65 L 733 69 M 740 69 L 745 69" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="760" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Консоль</text>
    <text x="730" y="105" font-family="'Lilex', 'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Run / Output</text>
    <text x="730" y="125" font-family="'Lilex', 'JetBrains Mono', monospace" font-size="11" fill="#64748b">результат</text>
  </g>
</svg>
