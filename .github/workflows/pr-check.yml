name: Check Quarto Build on PR

on:
  pull_request:
    branches:
      - main

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Install Dependencies
        shell: bash
        run: |
          uv venv --allow-existing
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          uv pip install -r requirements.txt

      - name: Incremental Quarto Validation
        shell: bash
        run: |
          # Ensure base branch is available for diffing
          git fetch origin main

          # Check if global configurations or styles changed
          GLOBAL_CHANGES=$(git diff --name-only origin/main...HEAD -- '_quarto.yml' 'style.css' 'requirements.txt' || true)

          # Find changed or added .qmd files (ignoring deleted files)
          CHANGED_QMDS=$(git diff --name-only --diff-filter=d origin/main...HEAD -- '*.qmd' || true)

          if [ -n "$GLOBAL_CHANGES" ]; then
            echo "▶ Global config/styles changed: $GLOBAL_CHANGES"
            echo "Running full project validation (HTML)..."
            quarto render --to live-html
          elif [ -n "$CHANGED_QMDS" ]; then
            echo "▶ Rendering only modified .qmd files:"
            echo "$CHANGED_QMDS"
            EXISTING_QMDS=()
            for file in $CHANGED_QMDS; do
              if [ -f "$file" ]; then
                EXISTING_QMDS+=("$file")
              fi
            done
            if [ ${#EXISTING_QMDS[@]} -gt 0 ]; then
              quarto render "${EXISTING_QMDS[@]}"
            fi
          else
            echo "▶ No .qmd files or global configs changed (static/doc changes only). Running quick syntax check..."
            quarto check
          fi
