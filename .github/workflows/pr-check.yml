name: Check Quarto Build on PR

on:
  pull_request:
    branches:
      - main

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt
          
      - name: Cache Quarto Freeze
        uses: actions/cache@v4
        with:
          path: _freeze
          key: freeze-${{ github.ref }}-${{ hashFiles('**/*.qmd') }}
          restore-keys: |
            freeze-${{ github.ref }}-
            freeze-main-
            freeze-
          
      - name: Render Quarto Project
        # This will render the entire site (including HTML and Typst PDFs) 
        # to ensure there are no build errors, but it will NOT publish it.
        run: quarto render
