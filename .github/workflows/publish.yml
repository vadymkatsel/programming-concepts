on:
  push:
    branches:
      - main
  workflow_dispatch:

name: Quarto Publish

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "quarto-publish"
  cancel-in-progress: true

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Install Dependencies
        shell: bash
        run: |
          uv venv --allow-existing
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          uv pip install -r requirements.txt
          
      - name: Cache Rendered PDFs
        uses: actions/cache@v4
        with:
          path: .pdf-cache
          key: pdf-cache-v1-${{ hashFiles('courses/**/*.qmd', '_quarto.yml') }}
          restore-keys: |
            pdf-cache-v1-

      - name: Render Quarto HTML
        run: quarto render --to live-html

      - name: Incremental PDF Build & Link Verification
        run: python scripts/build_pdfs.py

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
